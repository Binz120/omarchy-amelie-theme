# Amélie: prompt. Rendered from colors.toml by scripts/render-app-themes.py.

format = """\
[┌─](#839D5C)\
$os$username$hostname$directory$git_branch$git_status$cmd_duration
[└─](#839D5C)$character"""

right_format = """$time"""

[os]
disabled = false
style = "#E8B04A"

[os.symbols]
Linux = "󰌽 "

[username]
style_user = "#FFF9EA bold"
style_root = "#F67D72 bold"
format = "[$user]($style) "

[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "#9ECBA6"

[directory]
style = "#E8B04A bold"
read_only = " 󰌾"
truncation_length = 3
truncation_symbol = "…/"
format = "[$path]($style)[$read_only]($read_only_style) "

[git_branch]
style = "#B5D28E"
format = " on [ $branch]($style)"
symbol = ""

[git_status]
style = "#F67D72"
format = "[$all_status$ahead_behind]($style)"
conflicted = "✖"
ahead = "⇡$count"
behind = "⇣$count"
diverged = "⇕⇡$ahead_count⇣$behind_count"
untracked = "?$count"
modified = "!$count"
staged = "+$count"
renamed = "»$count"
deleted = "✘$count"

[cmd_duration]
min_time = 2000
style = "#839D5C"
format = "[ $duration]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "#839D5C"
format = "[$time]($style)"

[character]
success_symbol = "[❯](#B5D28E)"
error_symbol = "[❯](#F67D72)"
vimcmd_symbol = "[❮](#E8B04A)"
