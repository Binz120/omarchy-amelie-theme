# Amélie: mako notification daemon. Include from ~/.config/mako/config:
#   include=~/.local/state/omarchy/current/theme/mako.ini
background-color=#212E20
text-color=#F5E1B8
border-color=#E8B04A
progress-color=over #2E5B34
icon-path=/usr/share/icons/Yaru-sage-dark
max-icon-size=48
default-timeout=5000

[urgency=low]
border-color=#839D5C
text-color=#839D5C

[urgency=critical]
border-color=#F67D72
text-color=#FFF9EA
default-timeout=0
